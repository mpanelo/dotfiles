############################
# Mau's Tmux Configuration #
############################

set -g status-position bottom

set -g base-index 1          # Use 1-based indexing when creating windows
setw -g pane-base-index 1    # Use 1-based indexing when creating panes
setw -g mode-keys vi         # Vi bindings in copy mode
set -sg escape-time 10       # 10ms delay after Esc
set -g detach-on-destroy off # Stay in tmux when a session is killed
set -g renumber-windows on   # Renumber windows when a window is closed
set -g focus-events on       # Focus events enabled for terminals that support it

# Support 256 color
set -g default-terminal "tmux-256color"

# Undercurl support for neovim diagnostics
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Mouse mode
set -g mouse on

# Vim-like split keybindings
unbind '"'
unbind %
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

bind Escape copy-mode # Mimics entering "normal" mode in nvim

# Keep the current path when creating a new window
bind c new-window -c '#{pane_current_path}'

bind -r C-j resize-pane -D 15
bind -r C-k resize-pane -U 15
bind -r C-h resize-pane -L 15
bind -r C-l resize-pane -R 15

bind-key -n C-S-Left swap-window -d -t -1
bind-key -n C-S-Right swap-window -d -t +1

set -g set-clipboard on
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-selection

unbind -T copy-mode-vi MouseDragEnd1Pane

bind x confirm-before -p "Kill pane #P? (y/N)" kill-pane

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Configure the catppuccin plugin
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_current_text " #W "
set -g @catppuccin_window_text " #W "

# Resolve the XDG tmux directory once for the commands below.
set-environment -g TMUX_CONFIG_DIR "$HOME/.config/tmux"
if-shell 'test -n "$XDG_CONFIG_HOME"' \
  'set-environment -g TMUX_CONFIG_DIR "$XDG_CONFIG_HOME/tmux"'

# Detect battery hardware without making battery status mandatory.
if-shell '"$TMUX_CONFIG_DIR/has-battery.sh"' \
  'set -g @show_battery 1' \
  'set -g @show_battery 0'

# Load Catppuccin before defining its status modules.
run-shell '"$TMUX_CONFIG_DIR/plugins/catppuccin-tmux/catppuccin.tmux"'

# The Catppuccin fork does not provide a Continuum module, so define one
# locally using the same status-module layout.
%hidden MODULE_NAME="continuum"
set -g @catppuccin_continuum_icon "󰆓 "
set -gF @catppuccin_continuum_color "#{E:@thm_pink}"
set -g @catppuccin_continuum_text " #{l:#{continuum_status}}"
run-shell 'tmux source-file "$TMUX_CONFIG_DIR/plugins/catppuccin-tmux/utils/status_module.conf"'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'mpanelo/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Custom status line
set -g status-left-length 100
set -g status-right-length 100
set -g window-status-separator ''
set -g status-left '#{E:@catppuccin_status_session}'
set -gF status-right '#{E:@catppuccin_status_continuum}'
if-shell '[ "#{@show_battery}" = 1 ]' \
  'set -agF status-right "#{E:@catppuccin_status_battery}"' \
  ''

# Initialize TPM after status modules are defined so tmux-battery and
# tmux-continuum can replace their interpolations.
run-shell '"$TMUX_CONFIG_DIR/plugins/tpm/tpm"'
